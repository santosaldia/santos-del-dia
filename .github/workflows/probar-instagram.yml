name: Probar Instagram

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probar_instagram.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
